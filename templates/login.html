<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Digital Sign</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 380px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h2 { color: #1a56db; font-size: 24px; }
        .logo p { color: #666; font-size: 13px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #1a56db; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1440a0; }
        .error { background: #fee; color: #c00; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
        label { font-size: 13px; color: #444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h2>🔐 DigiSign SI </h2>
            <p>Sistem Tanda Tangan Digital</p>
        </div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Masukkan username" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="Masukkan password" required>
            <button type="submit">Login</button>
        </form>
        <p style="text-align:center; margin-top:15px; font-size:12px; color:#999;">Default: testuser / password123</p>
    </div>
</body>
</html>
